spring:
  application:
    name: sonar
  # request handling and @Scheduled jobs on virtual threads: no pool of ~200 parked platform threads
  threads:
    virtual:
      enabled: true
  datasource:
    # no AUTO_SERVER: that opens an H2 TCP server (user sa, no password) on every interface
    url: jdbc:h2:file:./data/sonar
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # the jar stamps every file 1980, so with no Cache-Control browsers (and the WebKit window) treat
  # the UI as fresh for years and keep stale CSS/JS after a deploy. Tiny files on localhost: never cache.
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  # localhost only: the API controls audio and OBS (recording, screenshots) and has no auth
  address: 127.0.0.1
  port: 8080

sonar:
  poll-ms: 1000
  default-channels: Game,Chat,Media,Aux
